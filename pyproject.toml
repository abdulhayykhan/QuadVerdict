[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quadverdict"
version = "0.1.0"
description = "Publication-grade, cost-sensitive credit default benchmark of four machine learning paradigms with Nadeau-Bengio corrected statistical significance and interactive dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Abdul Hayy Khan", email = "abdulhayykhan.dev@gmail.com" }
]
keywords = [
    "machine-learning",
    "credit-risk",
    "credit-default",
    "cost-sensitive-learning",
    "benchmark",
    "random-forest",
    "decision-trees",
    "support-vector-machines",
    "logistic-regression",
    "scikit-learn",
    "nadeau-bengio",
    "statistical-significance",
    "explainable-ai",
    "financial-ml"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://quad-verdict.vercel.app/"
Repository = "https://github.com/abdulhayykhan/QuadVerdict"
Documentation = "https://github.com/abdulhayykhan/QuadVerdict/tree/main/docs"
Issues = "https://github.com/abdulhayykhan/QuadVerdict/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Exit 0 when no tests are collected (stubs pass vacuously during skeleton phase)
empty_parameter_set_mark = "skip"
# Avoid polluting the working directory with pytest cache
cache_dir = ".pytest_cache"

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, B: flake8-bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function call in default argument
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements freely and have longer lines
"tests/*" = ["S101", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
